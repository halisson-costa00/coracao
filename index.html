<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">
  <title>Coração para Gabriele</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; width: 100%; height: 100%; overflow: hidden;
      background: #000; font-family: Arial, Helvetica, sans-serif; color: white;
      touch-action: none;
    }
    #c { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 1; }
    h1 {
      position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
      z-index: 100; margin: 0; font-size: clamp(30px, 7vw, 48px); font-weight: 900;
      white-space: nowrap;
      background: linear-gradient(270deg,#ff3366,#ffcc33,#33ffcc,#3366ff,#cc33ff,#ff3366);
      background-size: 1000% 1000%; -webkit-background-clip: text;
      background-clip: text; -webkit-text-fill-color: transparent;
      animation: gradientShift 8s ease infinite, pulse 2s ease-in-out infinite;
      filter: drop-shadow(0 0 8px rgba(255,255,255,.45));
      pointer-events: none;
    }
    @keyframes gradientShift {
      0%,50%,100% { background-position: 0% 50%; }
      25%,75% { background-position: 100% 50%; }
    }
    @keyframes pulse {
      0%,100% { transform: translateX(-50%) scale(1); }
      50% { transform: translateX(-50%) scale(1.12); }
    }
    #controls-container { position: fixed; top: 14px; left: 14px; z-index: 200; }
    .buttons { display: flex; gap: 6px; flex-wrap: wrap; }
    button {
      background: rgba(0,0,0,.72); color: white; border: 1px solid rgba(255,255,255,.18);
      padding: 9px 11px; border-radius: 8px; cursor: pointer; backdrop-filter: blur(5px);
    }
    #controls {
      margin-top: 7px; background: rgba(70,70,70,.30); padding: 12px;
      border-radius: 12px; width: min(300px, calc(100vw - 28px)); backdrop-filter: blur(8px);
    }
    .control-group { margin: 9px 0; display: flex; align-items: center; gap: 8px; }
    .control-group label { width: 90px; font-size: 13px; }
    .control-group input[type="range"] { flex: 1; min-width: 80px; }
    .control-group span { width: 30px; text-align: right; font-size: 13px; }
    .control-group select {
      flex: 1; padding: 5px; border-radius: 5px; background: #333; color: white; border: 0;
    }
    @media (max-width: 600px) {
      h1 { top: 72px; }
      #controls-container { top: 8px; left: 8px; }
      #controls { width: min(285px, calc(100vw - 16px)); }
      .control-group label { width: 82px; font-size: 12px; }
    }
  </style>
</head>
<body>
  <h1>GABRIELE</h1>

  <div id="controls-container">
    <div class="buttons">
      <button id="toggle-controls">Controles</button>
      <button id="toggle-fullscreen">Tela Cheia</button>
    </div>
    <div id="controls">
      <div class="control-group">
        <label for="colorScheme">Cores:</label>
        <select id="colorScheme">
          <option value="rainbow">Arco-íris</option>
          <option value="red">Vermelho</option>
          <option value="green">Verde</option>
          <option value="blue">Azul</option>
          <option value="monochrome">Monocromático</option>
        </select>
      </div>
      <div class="control-group">
        <label for="particleSize">Tamanho:</label>
        <input type="range" id="particleSize" min="1" max="20" value="10">
        <span id="particleSizeValue">10</span>
      </div>
      <div class="control-group">
        <label for="particleCount">Partículas:</label>
        <input type="range" id="particleCount" min="10" max="70" value="32">
        <span id="particleCountValue">32</span>
      </div>
      <div class="control-group">
        <label for="speed">Velocidade:</label>
        <input type="range" id="speed" min="0.1" max="2" step="0.1" value="1">
        <span id="speedValue">1</span>
      </div>
      <div class="control-group">
        <label for="mouseInfluence">Seguir:</label>
        <input type="range" id="mouseInfluence" min="0" max="100" value="50">
        <span id="mouseInfluenceValue">50</span>
      </div>
    </div>
  </div>

  <canvas id="c"></canvas>

  <script>
    const config = { particleCount:32, speed:1, colorScheme:'rainbow', mouseInfluence:50, particleSize:10 };
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d', { alpha:false });
    let canvasWidth, canvasHeight, dpr = 1;
    let trails = [], heartPath = [], sunflowers = [];
    let mouseX = 0, mouseY = 0, mouseActive = false;

    function resizeCanvas() {
      canvasWidth = window.innerWidth;
      canvasHeight = window.innerHeight;
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.round(canvasWidth * dpr);
      canvas.height = Math.round(canvasHeight * dpr);
      canvas.style.width = canvasWidth + 'px';
      canvas.style.height = canvasHeight + 'px';
      ctx.setTransform(dpr,0,0,dpr,0,0);
      initHeartPath();
    }

    class Sunflower {
      constructor(resetBottom=false) {
        this.x = Math.random()*canvasWidth;
        this.y = resetBottom ? canvasHeight + Math.random()*100 : Math.random()*canvasHeight;
        this.size = Math.random()*18+9;
        this.speed = Math.random()*.45+.18;
        this.angle = Math.random()*Math.PI*2;
      }
      update() {
        this.y -= this.speed;
        this.angle += .01;
        if (this.y + this.size < 0) {
          this.x = Math.random()*canvasWidth;
          this.y = canvasHeight + this.size;
        }
      }
      draw() {
        ctx.save();
        ctx.translate(this.x,this.y);
        ctx.rotate(this.angle);
        ctx.fillStyle = '#ffd51f';
        for(let i=0;i<10;i++){
          ctx.save();
          ctx.rotate(i*Math.PI/5);
          ctx.beginPath();
          ctx.ellipse(this.size*.62,0,this.size*.34,this.size*.15,0,0,Math.PI*2);
          ctx.fill();
          ctx.restore();
        }
        ctx.fillStyle='#6b3d16';
        ctx.beginPath();
        ctx.arc(0,0,this.size*.30,0,Math.PI*2);
        ctx.fill();
        ctx.restore();
      }
    }

    function initSunflowers(){
      sunflowers = Array.from({length:15},()=>new Sunflower());
    }

    function initHeartPath(){
      heartPath=[];
      const steps=Math.max(48,config.particleCount*2);
      const scale=Math.min(canvasWidth/430,canvasHeight/500,1);
      const sx=180*scale, sy=10*scale;
      const centerY=canvasHeight/2+20*scale;
      for(let i=0;i<steps;i++){
        const t=(i/steps)*Math.PI*2;
        heartPath.push([
          canvasWidth/2 + sx*Math.pow(Math.sin(t),3),
          centerY + sy*(-(15*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t)))
        ]);
      }
    }

    function particleColor(i){
      let hue, saturation=Math.random()*35+65, brightness=Math.random()*45+35;
      switch(config.colorScheme){
        case 'red': hue=Math.random()*20+350; break;
        case 'blue': hue=Math.random()*25+200; break;
        case 'green': hue=Math.random()*25+100; break;
        case 'monochrome': hue=0; saturation=0; brightness=Math.random()*45+45; break;
        default: hue=i/config.particleCount*360;
      }
      return `hsla(${hue},${saturation}%,${brightness}%,.16)`;
    }

    function initParticles(){
      trails=[];
      if(!heartPath.length) initHeartPath();
      const trailLength=Math.min(config.particleCount,45);
      for(let i=0;i<config.particleCount;i++){
        const particles=[];
        const x=Math.random()*canvasWidth, y=Math.random()*canvasHeight;
        const color=particleColor(i);
        for(let k=0;k<trailLength;k++){
          particles.push({
            x,y,velX:0,velY:0,
            radius:((1-k/trailLength)+1)*config.particleSize/2,
            speed:Math.random()+1,
            targetIndex:Math.floor(Math.random()*heartPath.length),
            direction:i%2*2-1,
            friction:Math.random()*.2+.7,
            color
          });
        }
        trails.push(particles);
      }
    }

    function renderParticle(p){
      ctx.fillStyle=p.color;
      ctx.beginPath();
      ctx.arc(p.x,p.y,p.radius,0,Math.PI*2);
      ctx.fill();
    }

    function animationLoop(){
      ctx.fillStyle='rgba(0,0,0,.22)';
      ctx.fillRect(0,0,canvasWidth,canvasHeight);

      for(const sf of sunflowers){ sf.update(); sf.draw(); }

      for(const trail of trails){
        if(!trail.length || !heartPath.length) continue;
        const leader=trail[0];
        const target=heartPath[leader.targetIndex%heartPath.length];
        if(!target) continue;

        if(mouseActive && config.mouseInfluence>0){
          const dxm=mouseX-leader.x, dym=mouseY-leader.y;
          const md=Math.hypot(dxm,dym);
          if(md>0.001 && md<300){
            const force=(1-md/300)*(config.mouseInfluence/20);
            leader.velX+=(dxm/md)*force;
            leader.velY+=(dym/md)*force;
          }
        }

        const dx=leader.x-target[0], dy=leader.y-target[1];
        const dist=Math.max(Math.hypot(dx,dy),.001);

        if(dist<10){
          if(Math.random()>.95) leader.targetIndex=Math.floor(Math.random()*heartPath.length);
          else{
            if(Math.random()>.99) leader.direction*=-1;
            leader.targetIndex=(leader.targetIndex+leader.direction+heartPath.length)%heartPath.length;
          }
        }

        leader.velX+=(-dx/dist)*leader.speed*config.speed;
        leader.velY+=(-dy/dist)*leader.speed*config.speed;
        leader.x+=leader.velX; leader.y+=leader.velY;
        leader.velX*=leader.friction; leader.velY*=leader.friction;
        renderParticle(leader);

        for(let k=1;k<trail.length;k++){
          trail[k].x-=(trail[k].x-trail[k-1].x)*.7;
          trail[k].y-=(trail[k].y-trail[k-1].y)*.7;
          renderParticle(trail[k]);
        }
      }
      requestAnimationFrame(animationLoop);
    }

    function setPointer(x,y){ mouseX=x; mouseY=y; mouseActive=true; }

    function setupControls(){
      const controls=document.getElementById('controls');
      let visible=true;

      document.getElementById('toggle-controls').onclick=()=>{
        visible=!visible;
        controls.style.display=visible?'block':'none';
      };

      document.getElementById('toggle-fullscreen').onclick=async()=>{
        try{
          if(!document.fullscreenElement && document.documentElement.requestFullscreen)
            await document.documentElement.requestFullscreen();
          else if(document.exitFullscreen) await document.exitFullscreen();
        }catch(e){}
      };

      document.getElementById('particleCount').oninput=e=>{
        config.particleCount=parseInt(e.target.value);
        document.getElementById('particleCountValue').textContent=config.particleCount;
        initHeartPath(); initParticles();
      };
      document.getElementById('speed').oninput=e=>{
        config.speed=parseFloat(e.target.value);
        document.getElementById('speedValue').textContent=config.speed;
      };
      document.getElementById('colorScheme').onchange=e=>{
        config.colorScheme=e.target.value; initParticles();
      };
      document.getElementById('mouseInfluence').oninput=e=>{
        config.mouseInfluence=parseInt(e.target.value);
        document.getElementById('mouseInfluenceValue').textContent=config.mouseInfluence;
      };
      document.getElementById('particleSize').oninput=e=>{
        config.particleSize=parseInt(e.target.value);
        document.getElementById('particleSizeValue').textContent=config.particleSize;
        initParticles();
      };

      document.addEventListener('mousemove',e=>setPointer(e.clientX,e.clientY));
      document.addEventListener('mouseleave',()=>mouseActive=false);
      document.addEventListener('touchstart',e=>{
        if(e.touches[0]) setPointer(e.touches[0].clientX,e.touches[0].clientY);
      },{passive:true});
      document.addEventListener('touchmove',e=>{
        if(e.touches[0]) setPointer(e.touches[0].clientX,e.touches[0].clientY);
      },{passive:true});
      document.addEventListener('touchend',()=>mouseActive=false,{passive:true});

      window.addEventListener('resize',()=>{ resizeCanvas(); initParticles(); });
    }

    resizeCanvas();
    initSunflowers();
    initParticles();
    setupControls();
    animationLoop();
  </script>
</body>
</html>
